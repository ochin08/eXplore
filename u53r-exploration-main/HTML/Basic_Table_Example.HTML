

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Table</title>
</head>
<body>

    <h2>Basic Table Example</h2>

    <table border="1">
        <tr>
            <th colspan="3" style="text-align: center;">Header 1</th>
        </tr>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
            <td>Data 3</td>
        </tr>
        <tr>
            <td>Data 4</td>
            <td>Data 5</td>
            <td>Data 6</td>
        </tr>
    </table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Table Example</title>
</head>
<body>
  
  <table border="1">
    <tr>
      <th rowspan="2">Pangalan</th>
      <th colspan="2">Grado</th>
    </tr>
    <tr>
      <th>Math</th>
      <th>Science</th>
    </tr>
    <tr>
      <td>Juan</td>
      <td>90</td>
      <td>85</td>
    </tr>
    <tr>
      <td>Ana</td>
      <td>88</td>
      <td>92</td>
    </tr>
  </table>

</body>
</html>
