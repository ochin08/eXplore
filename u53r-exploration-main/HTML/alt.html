




<!--
Ang alt attribute ay pinaka-karaniwang ginagamit sa mga imahe.
Kung ang isang larawan ay hindi maipakita (halimbawa, kung may error sa pag-load ng imahe), 
ipapakita ang teksto na inilagay sa alt attribute bilang kapalit.
Gayundin, sa mga screen reader para sa mga may kapansanan, ang alt text ay binabasa bilang isang alternatibong deskripsyon ng imahe.
-->







<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="image-not-found.jpg" alt="Ang imahe ay hindi matatagpuan." />
</body>
</html>
